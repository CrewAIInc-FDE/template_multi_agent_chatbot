<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · CrewAI Chatbot</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/crewai-logo.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-page">
    <form class="login-card" method="POST" autocomplete="off">
      <img src="/static/img/crewai-logo.svg" alt="CrewAI" class="login-logo">
      <h1 class="login-title">CrewAI Chat</h1>
      <p class="login-subtitle">Enter the shared demo password to continue.</p>

      <input
        type="password"
        name="password"
        class="login-input"
        placeholder="Password"
        aria-label="Password"
        autofocus
        required>

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <button type="submit" class="login-button">Sign in</button>
    </form>
  </div>
</body>
</html>
